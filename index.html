<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniPlayer</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
    <script src="src/js/script.js" defer> </script>

    <div id="player">

        <div id="photo">
            <img  src="src/assets/images/songs/image2.png" alt="song image" id="image">
        </div>
        <div id="songandartistname">
            <p>Liquid Smooth<br>Mitski</p>
        </div>

        <div id="controls">

            <div id="progressbar">
                <span id="currentTime">0:00</span>
                <input 
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0">
                <span id="duration">0:00</span>
            </div>

            <button class="keys" onclick="actionPlayer('back')">
                <img src="src/assets/images/buttons/backward.png">
            </button>

            <button class="keys" onclick="actionPlayer('pause')">
                <img  id="playicon" src="src/assets/images/buttons/play.png">
            </button>

            <button class="keys" onclick="actionPlayer('forward')">
                <img src="src/assets/images/buttons/forward.png">
            </button>

        </div>
    </div>
</body>
</html>
